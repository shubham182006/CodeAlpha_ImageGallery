<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Image Gallery</h1>
    <div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('travel')">Travel</button>
</div>

    <div class="gallery">

    <img class="nature"
         src="https://picsum.photos/id/1015/500/350"
         alt="Nature">

    <img class="travel"
         src="https://picsum.photos/id/1016/500/350"
         alt="Travel">

    <img class="nature"
         src="https://picsum.photos/id/1018/500/350"
         alt="Nature">

    <img class="travel"
         src="https://picsum.photos/id/1025/500/350"
         alt="Travel">

    <img class="nature"
         src="https://picsum.photos/id/1035/500/350"
         alt="Nature">

    <img class="travel"
         src="https://picsum.photos/id/1043/500/350"
         alt="Travel">

</div>
<div class="lightbox" id="lightbox">

    <button class="close">&times;</button>

    <button class="prev">&#10094;</button>

    <img id="lightboxImage" src="" alt="Full Image">

    <button class="next">&#10095;</button>

</div>

<script src="script.js"></script>

</body>

</html>
